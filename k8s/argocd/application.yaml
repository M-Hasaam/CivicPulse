apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civicpulse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/M-Hasaam/CivicPulse.git
    targetRevision: deploy/prod
    # k8s/base, not overlays/prod: the prod overlay's secretGenerator merges
    # in a gitignored local secrets.env file that only exists in a CI
    # runner's own checkout - the repo-server clones fresh from git and has
    # no such file, so kustomize build fails before rendering anything.
    # Base's secretGenerator has no external file dependency and builds
    # cleanly from a bare clone. See cd.yml's "Update deploy/prod" step.
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: civicpulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
