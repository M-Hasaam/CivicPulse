apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: civicpulse
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: civicpulse
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" && exit 0
                echo "waiting for postgres ($i/60)..."
                sleep 2
              done
              echo "postgres never became ready" >&2
              exit 1
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_USER
      containers:
        - name: migrate
          image: ghcr.io/m-hasaam/civicpulse/backend:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - export DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" && exec alembic upgrade head
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_DB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: civicpulse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: civicpulse
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: backend
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-migrate
          image: rancher/kubectl:v1.31.0
          command:
            [
              "kubectl",
              "wait",
              "--for=condition=complete",
              "job/migrate",
              "--timeout=300s",
            ]
      containers:
        - name: backend
          image: ghcr.io/m-hasaam/civicpulse/backend:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - export DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 20
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: civicpulse-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_DB
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: GROQ_API_KEY
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            # cpu.requests updated from 100m to 550m per the VPA recommendation
            # (Target: 548m, see docs/evidence/vpa-*.txt) after a load test showed
            # actual usage running 300-400% over the old request's implied HPA
            # target. limits.cpu raised to keep meaningful burst headroom above it.
            requests:
              cpu: 550m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: civicpulse
  ports:
    - name: http
      port: 8000
      targetPort: http
