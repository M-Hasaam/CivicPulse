apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: civicpulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: migrate-job-reader
  namespace: civicpulse
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-migrate-job-reader
  namespace: civicpulse
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: civicpulse
roleRef:
  kind: Role
  name: migrate-job-reader
  apiGroup: rbac.authorization.k8s.io
