apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
configMapGenerator:
  - name: civicpulse-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - TRIAGE_PROVIDER=simulated
      - RATE_LIMIT_MAX_REQUESTS=10
      - RATE_LIMIT_WINDOW_SECONDS=60
      - TRUSTED_PROXY_HOPS=1
secretGenerator:
  - name: civicpulse-secrets
    literals:
      - POSTGRES_USER=civicpulse
      - POSTGRES_PASSWORD=change_me
      - POSTGRES_DB=civicpulse
      - DATABASE_URL=postgresql+asyncpg://civicpulse:change_me@postgres:5432/civicpulse
      - GROQ_API_KEY=
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: ghcr.io/m-hasaam/civicpulse/backend
    newTag: dev
  - name: ghcr.io/m-hasaam/civicpulse/frontend
    newTag: dev
