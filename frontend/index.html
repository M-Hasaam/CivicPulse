<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#236449" />
    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("civicpulse-theme") || "system";
        } catch {}
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <title>CivicPulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
