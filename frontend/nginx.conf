# nginx-unprivileged already listens on 8080 by default; kept explicit here so this
# file is the single source of truth for the port instead of an inherited default.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every backend route lives under /api (see backend/app/routes/*.py); forward the
    # request unchanged (no trailing slash on proxy_pass) so /api stays in the path.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backend's TRUSTED_PROXY_HOPS=1 trusts exactly this one hop's entry.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|openapi\.json|health|ready|metrics)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin proxy to Jaeger's OTLP HTTP receiver, exactly like /api above - the
    # browser never gets a baked-in Jaeger URL, and no CORS config is needed on Jaeger
    # itself. A no-op path if jaeger isn't running (--scale jaeger=0): the frontend's
    # exporter just fails silently in the background.
    location /otel/ {
        proxy_pass http://jaeger:4318/;
    }

    # Static assets and the SPA shell. try_files falls back to index.html so a
    # hard refresh on a client-side route still finds the app instead of a 404.
    location / {
        try_files $uri /index.html;
    }
}
