# nginx-unprivileged already listens on 8080 by default; kept explicit here so this
# file is the single source of truth for the port instead of an inherited default.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every backend route lives under /api (see backend/app/routes/*.py); forward the
    # request unchanged (no trailing slash on proxy_pass) so /api stays in the path.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backend's TRUSTED_PROXY_HOPS=1 trusts exactly this one hop's entry.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|openapi\.json|health|ready|metrics)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin proxy to Jaeger's OTLP HTTP receiver, exactly like /api above - the
    # browser never gets a baked-in Jaeger URL, and no CORS config is needed on Jaeger
    # itself. jaeger has no equivalent Service in k8s/base/ (Compose-only, by design),
    # so this must resolve lazily per-request (a variable, not a bare proxy_pass) -
    # a static proxy_pass target is resolved once at nginx startup, and nginx refuses
    # to start at all if it can't resolve it, taking down the whole frontend everywhere
    # jaeger doesn't exist. NGINX_LOCAL_RESOLVERS is substituted from /etc/resolv.conf
    # at container start (Dockerfile's NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 + this file
    # served as a template) - correct in both Compose (Docker's embedded DNS) and
    # Kubernetes (cluster DNS) without hardcoding either. A missing jaeger now 502s
    # only /otel/, same as before this existed, instead of crashing the server.
    resolver ${NGINX_LOCAL_RESOLVERS};

    location /otel/ {
        # proxy_pass with a variable upstream (required above, for lazy DNS
        # resolution) stops nginx from auto-stripping the matched /otel/ prefix -
        # a request for /otel/v1/traces would otherwise be forwarded as
        # /otel/v1/traces instead of /v1/traces. Strip it explicitly. `set` must
        # come before `rewrite ... break` - break halts all rewrite-phase
        # directives in this block, including any set after it.
        set $jaeger_upstream "jaeger:4318";
        rewrite ^/otel/(.*)$ /$1 break;
        proxy_pass http://$jaeger_upstream;
    }

    # Static assets and the SPA shell. try_files falls back to index.html so a
    # hard refresh on a client-side route still finds the app instead of a 404.
    location / {
        try_files $uri /index.html;
    }
}
