# nginx-unprivileged already listens on 8080 by default; kept explicit here so this
# file is the single source of truth for the port instead of an inherited default.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS - only actually needed by the /otlp/ location
    # below. A *static* proxy_pass hostname is resolved once at nginx
    # startup; if it doesn't exist, nginx refuses to start at all (this
    # broke every route, not just /otlp/, when deployed anywhere jaeger
    # isn't running - e.g. Kubernetes, where OpenTelemetry is deliberately
    # compose-only). A *variable* hostname defers resolution to request
    # time via this resolver, so a missing "jaeger" host degrades to a
    # 502 on /otlp/ alone instead of taking nginx down entirely.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Every backend route lives under /api (see backend/app/routes/*.py); forward the
    # request unchanged (no trailing slash on proxy_pass) so /api stays in the path.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backend's TRUSTED_PROXY_HOPS=1 trusts exactly this one hop's entry.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bonus: OpenTelemetry traces. Relative path only, same rule /api/ follows -
    # the frontend never holds an absolute collector URL (docs/adr/0002).
    location /otlp/ {
        set $otlp_backend "jaeger:4318";
        proxy_pass http://$otlp_backend/;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|openapi\.json|health|ready|metrics)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets and the SPA shell. try_files falls back to index.html so a
    # hard refresh on a client-side route still finds the app instead of a 404.
    location / {
        try_files $uri /index.html;
    }
}
