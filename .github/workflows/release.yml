name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build semver images and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/$OWNER/civicpulse/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$OWNER/civicpulse/frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend release image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.version }}

      - name: Build and push frontend release image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.version }}

      - name: Create GitHub release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Images published to GHCR:
            - `${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}`
            - `${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}`
