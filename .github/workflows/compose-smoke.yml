name: Compose smoke

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: compose-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Compose integration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: civicpulse_ci_${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start stack without Ollama
        run: |
          docker compose --env-file .env.example up -d --build --scale ollama=0 --scale ollama-pull=0

      - name: Wait for frontend and backend readiness
        run: |
          for i in {1..60}; do
            if curl --fail --silent 'http://localhost/ready' | grep -q '"status":"ready"'; then
              exit 0
            fi
            docker compose --env-file .env.example ps
            sleep 5
          done
          docker compose --env-file .env.example logs
          exit 1

      - name: Smoke test request path through frontend nginx
        run: |
          curl --fail --silent --output /dev/null 'http://localhost/health'
          curl --fail --silent 'http://localhost/api/complaints?page=1&page_size=5' --output complaints.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('complaints.json').read_text())
          assert data['total'] >= 1, data
          assert len(data['items']) >= 1, data
          PY
          curl --fail --silent -X POST http://localhost/api/complaints \
            -H 'Content-Type: application/json' \
            --data '{"text":"Street light has been broken for two nights near the school gate.","location":"G-10 Markaz","reporter_contact":"ci@example.com"}' \
            --output created.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('created.json').read_text())
          assert data['id']
          assert data['status'] == 'open'
          assert data['triaged_by'] in {'rules', 'simulated', 'rules:fallback'}
          PY
          curl --fail --silent -D headers.txt 'http://localhost/api/stats' --output stats.json
          grep -i '^X-Cache:' headers.txt
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('stats.json').read_text())
          assert data['total_complaints'] >= 1, data
          PY

      - name: SIGTERM drains an in-flight request (real container, real signal)
        run: |
          BACKEND_CID=$(docker compose --env-file .env.example ps -q backend)
          test -n "$BACKEND_CID"

          curl --silent --max-time 25 -o created.json -w '%{http_code}' -X POST http://localhost/api/complaints \
            -H 'Content-Type: application/json' \
            --data '{"text":"Water main burst is flooding the intersection, cars are stalling.","location":"F-8 Markaz","reporter_contact":"sigterm-test@example.com"}' \
            > status.txt &
          REQUEST_PID=$!

          # No artificial delay: the container-kill roundtrip (Compose CLI -> Docker
          # daemon -> container PID 1) already takes long enough that curl's request
          # has been accepted by the time SIGTERM lands - this is what actually proves
          # "in-flight requests drain", not a contrived sleep in application code.
          docker compose --env-file .env.example kill -s SIGTERM backend

          wait "$REQUEST_PID"
          STATUS=$(cat status.txt)
          echo "in-flight request finished with status $STATUS"
          test "$STATUS" = "201"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('created.json').read_text())
          assert data['id'], data
          assert data['status'] == 'open', data
          PY

          for i in $(seq 1 25); do
            RUNNING=$(docker inspect -f '{{.State.Running}}' "$BACKEND_CID" 2>/dev/null || echo false)
            if [ "$RUNNING" = "false" ]; then
              echo "backend container exited ${i}s after SIGTERM"
              exit 0
            fi
            sleep 1
          done
          echo "backend container did not exit within 25s of SIGTERM (--timeout-graceful-shutdown is 20s)"
          docker compose --env-file .env.example logs backend
          exit 1

      - name: Show Compose state on failure
        if: failure()
        run: docker compose --env-file .env.example ps && docker compose --env-file .env.example logs

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans
