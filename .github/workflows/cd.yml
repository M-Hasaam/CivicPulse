name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    name: CD quality gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose files
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.prod.yaml config --quiet

  manifests:
    name: Kustomize and kubeconform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifests
        uses: ./.github/actions/validate-manifests

  publish-and-deploy:
    name: Publish GHCR images and deploy to kind
    runs-on: ubuntu-24.04
    needs: [quality-gate, manifests]
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signing (Sigstore OIDC) - no key material
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This job now builds two images, signs them, and generates two SBOMs
      # before it ever creates the kind cluster - enough extra disk/layer
      # usage on a standard runner to starve the later `kind` + ingress-nginx
      # image pull, which is what was timing out. Free the ~20-30 GB of
      # preinstalled toolchains this job never uses, before anything else runs.
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - name: Set image metadata
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/$OWNER/civicpulse/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$OWNER/civicpulse/frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.backend }}:latest

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.frontend }}:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend and frontend images (keyless)
        run: |
          cosign sign --yes "${{ steps.meta.outputs.backend }}@${{ steps.build-backend.outputs.digest }}"
          cosign sign --yes "${{ steps.meta.outputs.frontend }}@${{ steps.build-frontend.outputs.digest }}"

      - name: Generate SBOM for backend image
        uses: anchore/sbom-action@v0.17.9
        with:
          image: "${{ steps.meta.outputs.backend }}@${{ steps.build-backend.outputs.digest }}"
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: Generate SBOM for frontend image
        uses: anchore/sbom-action@v0.17.9
        with:
          image: "${{ steps.meta.outputs.frontend }}@${{ steps.build-frontend.outputs.digest }}"
          format: spdx-json
          output-file: sbom-frontend.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.spdx.json

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: civicpulse-cd
          config: .github/kind-config.yaml

      - name: Install nginx ingress for kind
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Install metrics-server for kind
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl wait --namespace kube-system \
            --for=condition=available deployment/metrics-server \
            --timeout=120s

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.2/manifests/install.yaml
          kubectl wait --namespace argocd \
            --for=condition=available deployment --all --timeout=300s
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=300s

      - name: Configure GHCR pull secret
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace civicpulse \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GITHUB_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Prepare prod secrets file (CI/kind placeholder only, never real credentials)
        run: |
          cat > k8s/overlays/prod/secrets.env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)
          EOF

      # NOTE: this identity only matches a real `push` to `main` (this workflow's
      # only non-manual trigger). A `workflow_dispatch` test run from a feature
      # branch has a different certificate identity (refs/heads/<branch>) and
      # will fail this check - by design, since this is the gate that decides
      # what's allowed to reach the cluster. To test signing/verification from a
      # branch, temporarily widen the regexp below to `refs/heads/.*` locally,
      # then revert before merging - never loosen it in a commit that lands on main.
      - name: Verify image signatures before deploying
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/cd.yml@refs/heads/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.meta.outputs.backend }}@${{ steps.build-backend.outputs.digest }}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/cd.yml@refs/heads/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.meta.outputs.frontend }}@${{ steps.build-frontend.outputs.digest }}"

      # GitOps: instead of applying manifests directly, commit the new image
      # digests to a dedicated deploy/prod branch (bot-authored only, never
      # main - so this can't retrigger this workflow) and let Argo CD
      # reconcile the cluster from that branch.
      - name: Update deploy/prod with the new image references
        run: |
          BACKEND_DIGEST="${{ steps.meta.outputs.backend }}@${{ steps.build-backend.outputs.digest }}"
          FRONTEND_DIGEST="${{ steps.meta.outputs.frontend }}@${{ steps.build-frontend.outputs.digest }}"
          echo "backend digest: $BACKEND_DIGEST"
          echo "frontend digest: $FRONTEND_DIGEST"
          git config user.name "civicpulse-cd-bot"
          git config user.email "cd-bot@users.noreply.github.com"
          git fetch origin deploy/prod || true
          if git show-ref --verify --quiet refs/remotes/origin/deploy/prod; then
            git checkout -B deploy/prod origin/deploy/prod
          else
            git checkout -B deploy/prod
          fi
          git checkout "${{ steps.meta.outputs.sha }}" -- k8s
          cd k8s/overlays/prod
          kustomize edit set image \
            "${{ steps.meta.outputs.backend }}=${BACKEND_DIGEST}" \
            "${{ steps.meta.outputs.frontend }}=${FRONTEND_DIGEST}"
          cd -
          git add k8s
          git commit -m "deploy: backend ${{ steps.build-backend.outputs.digest }}, frontend ${{ steps.build-frontend.outputs.digest }}" --allow-empty
          git push origin deploy/prod

      - name: Deploy the Argo CD Application
        run: |
          kubectl apply -f k8s/argocd/application.yaml
          for i in $(seq 1 40); do
            health=$(kubectl get application civicpulse -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "")
            sync=$(kubectl get application civicpulse -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "")
            echo "health=$health sync=$sync ($i/40)"
            if [ "$health" = "Healthy" ] && [ "$sync" = "Synced" ]; then
              break
            fi
            sleep 10
          done
          kubectl get application civicpulse -n argocd -o yaml
          test "$(kubectl get application civicpulse -n argocd -o jsonpath='{.status.health.status}')" = "Healthy"
          test "$(kubectl get application civicpulse -n argocd -o jsonpath='{.status.sync.status}')" = "Synced"

      - name: Smoke test the kind ingress
        run: |
          kubectl port-forward -n ingress-nginx service/ingress-nginx-controller 8080:80 >/tmp/ingress-port-forward.log 2>&1 &
          echo $! > /tmp/ingress-port-forward.pid
          for i in {1..60}; do
            if curl --fail --silent -H 'Host: civicpulse.localhost' http://127.0.0.1:8080/ready | grep -q '"status":"ready"'; then
              break
            fi
            sleep 3
          done
          curl --fail --silent -H 'Host: civicpulse.localhost' http://127.0.0.1:8080/
          curl --fail --silent -H 'Host: civicpulse.localhost' http://127.0.0.1:8080/api/stats
          kill "$(cat /tmp/ingress-port-forward.pid)"

      - name: Verify HPA is reading live metrics
        run: |
          for i in $(seq 1 40); do
            status=$(kubectl get hpa backend -n civicpulse -o jsonpath='{.status.conditions[?(@.type=="ScalingActive")].status}')
            if [ "$status" = "True" ]; then
              echo "HPA is actively scaling on metrics-server data"
              break
            fi
            echo "Waiting for metrics-server data to reach the HPA controller ($i/40)..."
            sleep 5
          done
          kubectl get hpa -n civicpulse
          test "$(kubectl get hpa backend -n civicpulse -o jsonpath='{.status.conditions[?(@.type=="ScalingActive")].status}')" = "True"

      - name: Warm up and start background load
        run: |
          for i in {1..30}; do
            if curl --fail --silent -H 'Host: civicpulse.localhost' http://127.0.0.1:8080/ready | grep -q '"status":"ready"'; then
              break
            fi
            sleep 2
          done
          docker run --rm -d --name k6-zero-downtime --network host \
            -v "${{ github.workspace }}/load:/load" \
            -e BASE_URL=http://127.0.0.1:8080 \
            -e HOST_HEADER=civicpulse.localhost \
            -e K6_DURATION=90s \
            grafana/k6:0.54.0 run /load/k6-zero-downtime.js --out json=/load/raw.jsonl

      - name: Trigger a rolling restart mid-load
        run: |
          sleep 15
          kubectl rollout restart deployment/backend -n civicpulse
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s

      - name: Wait for k6 to finish and collect the summary
        run: |
          docker wait k6-zero-downtime
          docker logs k6-zero-downtime
          test -f load/summary.json

      - name: Assert zero failed requests
        run: |
          failed=$(jq -r '.metrics.http_req_failed.values.passes' load/summary.json)
          total=$(jq -r '.metrics.http_reqs.values.count' load/summary.json)
          echo "total requests: $total, failed: $failed"
          test -n "$failed" && test "$failed" != "null"
          test "$failed" -eq 0

      - name: Save zero-downtime evidence
        if: always()
        run: |
          mkdir -p docs/evidence
          cp load/summary.json docs/evidence/zero-downtime-1-k6-summary.json || true
          kubectl rollout status deployment/backend -n civicpulse > docs/evidence/zero-downtime-2-rollout-log.txt || true

      - name: Upload zero-downtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-downtime-evidence
          path: docs/evidence/zero-downtime-*.*

      - name: Show cluster state on failure
        if: failure()
        run: |
          df -h / || true
          docker system df || true
          kubectl get pods,events -n ingress-nginx -o wide || true
          kubectl describe pods -n ingress-nginx || true
          kubectl get pods,events -n argocd -o wide || true
          kubectl get all,ingress,hpa -n civicpulse -o wide || true
          kubectl describe pods -n civicpulse || true
          kubectl logs -n civicpulse -l app.kubernetes.io/name=backend --tail=200 || true
          kubectl logs -n civicpulse -l app.kubernetes.io/name=frontend --tail=200 || true
