name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, type-check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@db.invalid:5432/test
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type-check
        run: mypy app

      - name: Pytest
        run: pytest --cov=app

  frontend:
    name: Frontend lint, type-check, tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-compose:
    name: Docker Compose config and image build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate development Compose file
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

      - name: Validate production Compose file
        env:
          IMAGE_TAG: ci
        run: docker compose --env-file .env.example -f compose.prod.yaml config --quiet

      - name: Build development images without Ollama
        run: docker compose --env-file .env.example -f compose.yaml build backend frontend migrate seed
