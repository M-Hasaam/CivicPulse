name: Security and manifests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: civicpulse-backend:ci
            context: backend
          - image: civicpulse-frontend:ci
            context: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build --pull -t ${{ matrix.image }} ${{ matrix.context }}

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:0.65.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --vuln-type os,library \
            --exit-code 1 \
            --format table \
            ${{ matrix.image }}

  manifests:
    name: Validate Kubernetes manifests
    uses: ./.github/workflows/validate-manifests.yml
    permissions:
      contents: read
