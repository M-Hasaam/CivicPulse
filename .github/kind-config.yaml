# The ingress-nginx kind manifest selects nodes with ingress-ready=true.
# CD reaches ingress through kubectl port-forward, so host port mappings are unnecessary.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
